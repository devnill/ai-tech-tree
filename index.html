  footer { text-align: center; padding: 18px 0 40px; }
  .legend { display: inline-flex; gap: 20px; font-size: 12.5px; color: #6d5a34; flex-wrap: wrap; justify-content: center; }
  .legend .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1.5px; border: 1px solid #8c6d3f; }
  .hint { margin-top: 9px; font-size: 12px; font-style: italic; color: #8a7343; }
</style>
</head>

// ---------- build node table ----------
const NODES = [], byId = {};
BRANCHES.forEach(b=>{
  RAW[b.k].forEach(r=>{
    const n = {id:r[0], name:r[1], icon:r[2], pre:r[3], d:r[4], br:b.k, c:b.c};
    NODES.push(n); byId[n.id] = n;
  });
});

// topological level: 1 + max(level of prereqs)
const memo = {};
function lvl(id){
  if (memo[id]) return memo[id];
  const n = byId[id];
  memo[id] = n.pre.length ? 1 + Math.max(...n.pre.map(lvl)) : 1;
  return memo[id];
}
NODES.forEach(n=>{ n.level = lvl(n.id); });
const MAXL = Math.max(...NODES.map(n=>n.level));

// ---------- layout ----------
const SLOTW = 128, LANE_GAP = 40, ROWH = 138, WRAPH = 92, TOP = 74, MARGIN = 46;
// group by branch+level, assign slots with wrapping
const groups = {};
NODES.forEach(n=>{
  const k = n.br + '|' + n.level;
  (groups[k] = groups[k] || []).push(n);
});
Object.values(groups).forEach(g=>{
  const ms = MAXSLOT[g[0].br];
  g.forEach((n,i)=>{ n.slot = i % ms; n.wrow = Math.floor(i / ms); n.rowCount = Math.min(g.length - Math.floor(i/ms)*ms, ms); });
});
// lane x offsets
let lx = MARGIN;
const laneStart = {}, laneWidth = {};
BRANCHES.forEach(b=>{
  laneStart[b.k] = lx;
  laneWidth[b.k] = MAXSLOT[b.k] * SLOTW;
  lx += laneWidth[b.k] + LANE_GAP;
});
const W = lx - LANE_GAP + MARGIN;
// level y offsets (height = rows needed at that level)
const levelRows = {};
for (let L=1; L<=MAXL; L++){
  levelRows[L] = 1;
  BRANCHES.forEach(b=>{
    const g = groups[b.k+'|'+L];
    if (g) levelRows[L] = Math.max(levelRows[L], Math.ceil(g.length / MAXSLOT[b.k]));
  });
}
const levelY = {};
let cy = TOP;
for (let L=1; L<=MAXL; L++){
  levelY[L] = cy;
  cy += ROWH + (levelRows[L]-1)*WRAPH;
}
const H = cy + 30;

NODES.forEach(n=>{
  const centerOffset = (MAXSLOT[n.br] - n.rowCount) * SLOTW / 2;
  n.x = laneStart[n.br] + centerOffset + n.slot*SLOTW + SLOTW/2;  // medal center x
  n.y = levelY[n.level] + n.wrow*WRAPH + 21 + 2;  // medal center y
});

// ---------- render ----------
const canvas = document.getElementById('canvas');
canvas.style.width = W+'px'; canvas.style.height = H+'px';

// lane headers
BRANCHES.forEach(b=>{
  const el = document.createElement('div');
  el.className = 'lane-head';
  el.style.left = (laneStart[b.k] + laneWidth[b.k]/2)+'px';
  el.style.setProperty('--c', b.c);
  el.textContent = b.name;
  canvas.appendChild(el);
});

// edges
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('class','edges'); svg.setAttribute('width',W); svg.setAttribute('height',H);
canvas.appendChild(svg);
// lane separator rails
BRANCHES.slice(1).forEach(b=>{
  const x = laneStart[b.k] - LANE_GAP/2;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M ${x} ${TOP-20} L ${x} ${H-16}`);
  p.setAttribute('stroke','#d8c69c'); p.setAttribute('stroke-width','1'); p.setAttribute('fill','none');
  svg.appendChild(p);
});

const EDGE_C = '#a8905f', EDGE_X = '#bfae83', EDGE_LIT = '#2b1d12';
const edgeEls = {};
const EDGES = [];
NODES.forEach(n=>n.pre.forEach(p=>EDGES.push([p, n.id])));
EDGES.forEach(([a,b])=>{
  const na = byId[a], nb = byId[b];
  const ra = 21, rb = 21;
  const x1 = na.x, y1 = na.y + ra + 32;   // out the bottom, below label
  const x2 = nb.x, y2 = nb.y - rb - 5;    // into the top of the medal
  const my = (y1+y2)/2;
  const cross = na.br !== nb.br;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2-2} L ${x2} ${y2}`);
  p.setAttribute('fill','none');
  p.setAttribute('stroke', cross?EDGE_X:EDGE_C);
  p.setAttribute('stroke-width', cross?'1.2':'1.5');
  p.setAttribute('stroke-dasharray','5 3');
  p.style.opacity = cross? .5 : .75;
  const tip = document.createElementNS('http://www.w3.org/2000/svg','path');
  tip.setAttribute('d',`M ${x2-3.5} ${y2-7} L ${x2} ${y2} L ${x2+3.5} ${y2-7} Z`);
  tip.setAttribute('fill', cross?EDGE_X:EDGE_C);
  tip.style.opacity = cross? .5 : .75;
  svg.appendChild(p); svg.appendChild(tip);
  edgeEls[a+'>'+b] = {p, tip, cross};
});

// lineage maps
const anc = {}, desc = {};
NODES.forEach(n=>{anc[n.id]=new Set(); desc[n.id]=new Set();});
function collectUp(id,set){ byId[id].pre.forEach(p=>{ if(!set.has(p)){ set.add(p); collectUp(p,set); } }); }
NODES.forEach(n=>collectUp(n.id, anc[n.id]));
EDGES.forEach(([a,b])=>{ desc[a].add(b); });
function collectDown(id,set){ desc[id].forEach(d0=>{}); }
// full descendants via repeated pass
NODES.forEach(n=>{
  const set = new Set(); const stack = [n.id];
  while (stack.length){
    const cur = stack.pop();
    EDGES.forEach(([a,b])=>{ if (a===cur && !set.has(b)){ set.add(b); stack.push(b); } });
  }
  n.descAll = set;
});

const tipEl = document.createElement('div'); tipEl.className='tip'; canvas.appendChild(tipEl);

const nodeEls = {};
NODES.forEach(n=>{
  const el = document.createElement('div');
  el.className = 'node';
  el.style.left = (n.x-61)+'px';
  el.style.top = (n.y - 21 - 2)+'px';
  el.style.setProperty('--c', n.c);
  el.innerHTML = `<div class="medal">${n.icon}</div><div class="nm">${n.name}</div>`;
  canvas.appendChild(el);
  nodeEls[n.id] = el;

  el.addEventListener('mouseenter', ()=>{
    const keep = new Set([n.id, ...anc[n.id], ...n.descAll]);
    NODES.forEach(m=>{
      nodeEls[m.id].classList.toggle('dim', !keep.has(m.id));
      nodeEls[m.id].classList.toggle('lit', keep.has(m.id));
    });
    Object.entries(edgeEls).forEach(([k,e])=>{
      const [a,b] = k.split('>');
      const on = keep.has(a) && keep.has(b);
      e.p.setAttribute('stroke', on?EDGE_LIT:(e.cross?EDGE_X:EDGE_C));
      e.p.setAttribute('stroke-width', on?'2.4':(e.cross?'1.2':'1.5'));
      e.tip.setAttribute('fill', on?EDGE_LIT:(e.cross?EDGE_X:EDGE_C));
      e.p.style.opacity = e.tip.style.opacity = on?1:.07;
    });
    tipEl.style.display='block';
    const needNames = n.pre.map(p=>byId[p].name).join(', ');
    tipEl.innerHTML = `<b>${n.name}</b><br>${n.d}` + (needNames?`<div class="needs">Unlocked by: ${needNames}</div>`:'<div class="needs">A starting point — no prerequisites.</div>');
    tipEl.style.left = Math.max(8, Math.min(n.x+40, W-266))+'px';
    tipEl.style.top = Math.max(6, n.y-80)+'px';
  });
  el.addEventListener('mouseleave', ()=>{
    NODES.forEach(m=>nodeEls[m.id].classList.remove('dim','lit'));
    Object.values(edgeEls).forEach(e=>{
      e.p.setAttribute('stroke', e.cross?EDGE_X:EDGE_C);
      e.p.setAttribute('stroke-width', e.cross?'1.2':'1.5');
      e.tip.setAttribute('fill', e.cross?EDGE_X:EDGE_C);
      e.p.style.opacity = e.tip.style.opacity = e.cross?.5:.75;
    });
    tipEl.style.display='none';
  });
});

document.getElementById('legend').innerHTML =
  BRANCHES.map(b=>`<span><span class="sw" style="background:${b.c}"></span>${b.name}</span>`).join('');

// fit-width zoom toggle
const vp = document.getElementById('viewport'), btn = document.getElementById('zoomBtn');
let fit = true;
function applyZoom(){
  const s = fit ? Math.min(1, (window.innerWidth - 24) / W) : 1;
  canvas.style.zoom = s;
  btn.textContent = fit ? 'Actual size' : 'Fit width';
}
btn.addEventListener('click', ()=>{ fit = !fit; applyZoom(); });
window.addEventListener('resize', applyZoom);
applyZoom();
</script>
